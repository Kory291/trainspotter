apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainspotter-backend
spec:
  selector:
    matchLabels:
      app: trainspotter-backend
  template:
    metadata:
      labels:
        app: trainspotter-backend
    spec:
      containers:
      - name: trainspotter-backend
        image: ghcr.io/kory291/trainspotter/trainspotter-backend:v1.0.3
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"

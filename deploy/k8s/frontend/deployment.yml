---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trainspotter-frontend
spec:
  selector:
    matchLabels:
      app: trainspotter-frontend
  template:
    metadata:
      labels:
        app: trainspotter-frontend
    spec:
      containers:
      - name: trainspotter-frontend
        image: ghcr.io/kory291/trainspotter/trainspotter-frontend:v1.0.3
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: "http://trainspotter-backend-service:8080"
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"
